<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<style>
  :root{
    --bg:#E8E0CC; --bg-2:#DFD5BB;
    --panel:#F6F1E3; --panel-line:#2B2620;
    --ink:#2B2620; --ink-2:#6B6152; --ink-3:#A79B85;
    --cave:#1B1826; --cave-panel:#262138; --cave-line:#0E0C16;
    --cave-text:#E4DEF2; --cave-2:#9C93B8; --cave-3:#5E5680;
    --cave-variant:#37304E; --cave-input:#201B30; --amber-n:#FFB84D; --mana-n:#B79AFF;
    --hp:#46C168; --hp-n:#5BD385;
    --amber:#F5A623; --danger:#E5484D; --danger-n:#FF6B6F;
    --xp:#3E9BFF; --xp-n:#66B0FF;
    --gold:#F5B301; --gold-n:#FFC53D; --gold-ink:#B98A00;
    --mana:#9B6DFF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:linear-gradient(180deg,var(--bg),var(--bg-2));
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    color:var(--ink);padding:44px 24px 80px;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700}
  .px{border:3px solid var(--panel-line);box-shadow:3px 3px 0 var(--panel-line)}
  .px4{border:3px solid var(--panel-line);box-shadow:4px 4px 0 var(--panel-line)}
  .page{max-width:1160px;margin:0 auto}

  header{text-align:center;margin-bottom:36px}
  .badge{display:inline-block;background:var(--ink);color:var(--gold);font-size:12px;letter-spacing:.3em;padding:6px 14px 6px 20px;margin-bottom:16px;font-weight:800}
  h1{font-size:36px;font-weight:800}
  h1 span{color:var(--gold)}
  .en{font-size:12px;letter-spacing:.4em;color:var(--ink-3);font-weight:800;margin-top:8px}
  .sub{font-size:15px;color:var(--ink-2);margin-top:12px;font-weight:600;line-height:1.7}
  .rules{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
  .rule{background:var(--panel);border:3px solid var(--panel-line);box-shadow:3px 3px 0 var(--panel-line);padding:10px 16px;max-width:320px;text-align:left}
  .rule .h{font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px}
  .rule .d{font-size:11px;color:var(--ink-2);font-weight:600;margin-top:4px;line-height:1.6}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:46px 30px;justify-items:center;margin-top:26px}
  .shot{position:relative}
  .cap{position:absolute;top:-30px;left:2px;font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--ink-2)}
  .cap b{color:var(--ink)} .cap small{color:var(--ink-3);font-weight:600}

  .phone{
    width:330px;height:664px;border-radius:18px;overflow:hidden;position:relative;
    display:flex;flex-direction:column;border:8px solid var(--panel-line);box-shadow:7px 7px 0 rgba(43,38,32,.4);
    background:var(--bg);
  }
  .phone.night{background:var(--cave)}
  .statusbar{display:flex;justify-content:space-between;padding:11px 18px 5px;font-size:11px;font-weight:800;color:var(--ink-2)}
  .night .statusbar{color:var(--cave-2)}
  .pagetitle{display:flex;justify-content:space-between;align-items:center;margin:0 12px 10px;background:var(--panel);padding:10px 12px}
  .pagetitle .t{font-size:15px;font-weight:800}
  .pagetitle .r{font-size:9px;color:var(--ink-3);letter-spacing:.08em;font-weight:800}
  .night .pagetitle{background:var(--cave-panel);border:3px solid var(--cave-line);box-shadow:3px 3px 0 var(--cave-line)}
  .night .pagetitle .t{color:var(--cave-text)} .night .pagetitle .r{color:var(--cave-3)}

  .btn{display:inline-flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer}
  .btn.green{background:var(--hp);color:#fff}
  .btn.blue{background:var(--xp);color:#fff}
  .btn.gold{background:var(--gold);color:var(--ink)}
  .btn.ghost{background:var(--panel);color:var(--ink-2)}
  .btn.red{background:var(--danger);color:#fff}
  .btn.px{border:3px solid var(--panel-line);box-shadow:3px 3px 0 var(--panel-line)}
  .hpbar{height:10px;border:2px solid var(--panel-line);background:var(--bg-2);position:relative}
  .hpbar i{position:absolute;left:0;top:0;bottom:0}
  .xpbar .cells{display:flex;gap:3px}
  .xpbar .cell{flex:1;height:12px;background:var(--bg-2);border:2px solid var(--panel-line)}
  .xpbar .cell.fill{background:var(--xp)}
  .checkbox{width:15px;height:15px;border:2.5px solid var(--ink-3);flex:none;background:var(--panel)}
  .checkbox.on{background:var(--hp);border-color:var(--ink);position:relative}
  .checkbox.on::after{content:"✓";position:absolute;inset:-3px 0 0 0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:800}
  .badge-tag{font-size:8px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border:2px solid currentColor}
  .star{color:var(--gold);letter-spacing:2px}
  .fieldlabel{font-size:9px;letter-spacing:.2em;color:var(--ink-3);font-weight:800}
  .notebox{background:#fff;border:3px solid var(--panel-line);padding:8px 10px;font-size:12px;font-weight:600;line-height:1.65;color:var(--ink);min-height:58px}

  .ach{background:var(--panel);border:3px solid var(--panel-line);position:relative;box-shadow:4px 4px 0 var(--panel-line)}
  .ach::before{content:"";position:absolute;inset:3px;border:2px solid var(--gold);pointer-events:none}

  .nav{margin-top:auto;display:flex;gap:8px;padding:10px 12px 16px;background:var(--panel);border-top:3px solid var(--panel-line)}
  .night .nav{background:var(--cave-panel);border-top-color:var(--cave-line)}
  .nav .item{flex:1;text-align:center;padding:7px 0 6px;border:3px solid var(--panel-line);font-size:10px;font-weight:800;color:var(--ink-2);background:var(--bg)}
  .night .nav .item{border-color:var(--cave-line);color:var(--cave-2);background:var(--cave)}
  .nav .item.on{background:var(--ink);color:var(--gold);box-shadow:2px 2px 0 rgba(43,38,32,.4)}
  .night .nav .item.on{background:var(--gold-n);color:var(--cave-line)}
  .nav .plus{flex:1.4;background:var(--gold);color:var(--ink);border:3px solid var(--panel-line);font-size:11px;font-weight:800;box-shadow:2px 2px 0 var(--panel-line);padding:3px 0;display:flex;align-items:center;justify-content:center;text-align:center}
  .night .nav .plus{background:var(--gold-n);color:var(--cave-line);border-color:var(--cave-line);box-shadow:2px 2px 0 var(--cave-line)}

  /* ── 夜间（洞窟）配色：只把昼间 token 重映射为 DESIGN_SYSTEM §3.1 的夜列值，
        不改变任何结构、间距或文案。所有规则限定 :not(.light-preview)，
        因此 ⑤⑨⑩ 的昼间主稿视图不受影响，仅作用于夜间克隆/夜间原生稿。 ── */
  .phone.night:not(.light-preview){border-color:var(--cave-line)}
  .night:not(.light-preview) .px{border-color:var(--cave-line);box-shadow:3px 3px 0 var(--cave-line)}
  .night:not(.light-preview) .px4{border-color:var(--cave-line);box-shadow:4px 4px 0 var(--cave-line)}
  .night:not(.light-preview) .ach{background:var(--cave-panel);border-color:var(--cave-line);box-shadow:4px 4px 0 var(--cave-line)}
  .night:not(.light-preview) .ach::before{border-color:var(--gold-n)}
  .night:not(.light-preview) .hpbar{border-color:var(--cave-line);background:var(--cave-variant)}
  .night:not(.light-preview) .xpbar .cell{background:var(--cave-variant);border-color:var(--cave-line)}
  .night:not(.light-preview) .xpbar .cell.fill{background:var(--xp-n)}
  .night:not(.light-preview) .checkbox{background:var(--cave);border-color:var(--cave-3)}
  .night:not(.light-preview) .checkbox.on{background:var(--hp-n);border-color:var(--cave-line)}
  .night:not(.light-preview) .notebox{background:var(--cave-input);border-color:var(--cave-line);color:var(--cave-text)}
  .night:not(.light-preview) .fieldlabel{color:var(--cave-3)}
  .night:not(.light-preview) .star{color:var(--gold-n)}
  .night:not(.light-preview) .rarity-stars{color:var(--gold-n)}
  .night:not(.light-preview) .back{background:var(--cave);border-color:var(--cave-line);box-shadow:2px 2px 0 var(--cave-line)}
  .night:not(.light-preview) .btn.green{background:var(--hp-n)}
  .night:not(.light-preview) .btn.blue{background:var(--xp-n)}
  .night:not(.light-preview) .btn.red{background:var(--danger-n)}
  .night:not(.light-preview) .btn.gold{background:var(--gold-n);color:var(--cave-line)}
  .night:not(.light-preview) .btn.ghost{background:var(--cave);color:var(--cave-2)}
  .night:not(.light-preview) .nav .item.on{box-shadow:2px 2px 0 rgba(0,0,0,.5)}
  .night:not(.light-preview) .home-small-card{background:var(--cave-panel);--card-accent:var(--xp-n)}
  .night:not(.light-preview) .home-small-card.achievement{--card-accent:var(--gold-n)}
  .night:not(.light-preview) .home-small-card.is-long{--card-accent:var(--hp-n)}
  .night:not(.light-preview) .home-small-card.is-medium{--card-accent:var(--amber-n)}
  .night:not(.light-preview) .home-small-card.is-short{--card-accent:var(--danger-n)}
  .night:not(.light-preview) .home-card-meta{color:var(--cave-3)}
  .night:not(.light-preview) .home-small-card.achievement .home-card-state{color:var(--cave-text)}

  .form-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
  .form-scroll::-webkit-scrollbar,.party-rail::-webkit-scrollbar{display:none}
  .back{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;margin-right:12px;border:3px solid var(--panel-line);box-shadow:2px 2px 0 var(--panel-line);background:var(--bg);font-size:18px;line-height:1}
  .rarity-stars{display:inline-flex;align-items:baseline;gap:2px;color:var(--gold);line-height:1}
  .rarity-stars .s1{font-size:13px}.rarity-stars .s2{font-size:17px}.rarity-stars .s3{font-size:21px}
  .party-rail{display:flex;gap:7px;margin-top:8px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .party-rail > *{flex:0 0 auto}

  /* 首页双列时刻卡：一个组件，只以语义色和时间进度区别。
     右上角为固定尺寸的用户自选图标槽，图标本身统一缩放。 */
  .home-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
  .home-small-card{--card-accent:var(--xp);--bar-width:50%;background:var(--panel);padding:10px 11px 9px;min-width:0}
  .home-small-card.achievement{--card-accent:var(--gold-ink)}
  .home-small-card.is-long{--card-accent:var(--hp);--bar-width:79%}
  .home-small-card.is-medium{--card-accent:var(--amber);--bar-width:53%}
  .home-small-card.is-short{--card-accent:var(--danger);--bar-width:26%}
  .home-card-top{display:grid;grid-template-columns:minmax(0,1fr) 25px;gap:7px;align-items:center;min-height:25px}
  .home-card-title-row{min-width:0;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
  .home-card-title{overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:800}
  .home-card-state{font-size:12px;font-weight:800;flex:none}
  .home-small-card.achievement .home-card-state{color:var(--ink)}
  .home-card-icon{width:auto;height:auto;display:flex;align-items:center;justify-content:center;border:0;color:var(--card-accent);font-size:17px;line-height:1;overflow:visible}
  .home-card-number{height:31px;display:flex;align-items:baseline;margin-top:3px;color:var(--card-accent);font-size:26px;font-weight:800;line-height:1}
  .home-card-number small{margin-left:3px;color:inherit;font-size:10px}
  .home-small-card .hpbar{margin-top:5px}
  .home-small-card .hpbar i{width:var(--bar-width);background:var(--card-accent)}
  .home-card-meta{min-height:10px;margin-top:4px;font-size:8px;color:var(--ink-3);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .home-scroll{flex:1;min-height:0;overflow-y:auto;padding:0 12px 12px;scrollbar-width:none}
  .home-scroll::-webkit-scrollbar{display:none}

  /* 日子簿日格 */
  .dg{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#C8C0E0;background:var(--cave-panel);border:2px solid var(--cave-line);position:relative}
  .dg.dim{color:#39424E}
  .dg.today{background:var(--gold-n);color:var(--cave-line);box-shadow:2px 2px 0 rgba(0,0,0,.5)}
  .dg .fx{position:absolute;bottom:3px;font-size:8px}

  /* 日历横滑翻页 */
  .cal-swipe{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .cal-swipe::-webkit-scrollbar{display:none}
  .cal-month{flex:0 0 100%;scroll-snap-align:start}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-arrow{cursor:pointer;user-select:none}
  /* 主稿的日子簿、设置、封印之地使用昼间 token；夜间版（11 屏全览）保存在页面底部夜间区。 */
  .light-preview{background:var(--bg)!important}
  .light-preview .statusbar{color:var(--ink-2)}
  .light-preview .pagetitle{background:var(--panel);border:3px solid var(--panel-line);box-shadow:3px 3px 0 var(--panel-line)}
  .light-preview .pagetitle .t{color:var(--ink)} .light-preview .pagetitle .r{color:var(--ink-3)}
  .light-preview .light-surface{background:var(--panel)!important;border-color:var(--panel-line)!important;box-shadow:3px 3px 0 var(--panel-line)!important}
  .light-preview .light-text{color:var(--ink)!important}.light-preview .light-muted{color:var(--ink-3)!important}.light-preview .light-success{color:var(--hp)!important}
  .light-preview .light-divider{border-color:var(--bg-2)!important}
  .light-preview [style*="background:var(--cave-panel)"]{background:var(--panel)!important}
  .light-preview [style*="background:var(--cave)"]{background:var(--bg)!important}
  .light-preview [style*="border:3px solid var(--cave-line)"],.light-preview [style*="border-color:var(--cave-line)"]{border-color:var(--panel-line)!important}
  .light-preview [style*="box-shadow:3px 3px 0 var(--cave-line)"]{box-shadow:3px 3px 0 var(--panel-line)!important}
  .light-preview [style*="color:var(--cave-text)"]{color:var(--ink)!important}
  .light-preview [style*="color:#DAD4EA"]{color:var(--ink)!important}
  .light-preview [style*="color:var(--cave-2)"],.light-preview [style*="color:var(--cave-3)"]{color:var(--ink-3)!important}
  .light-preview [style*="color:var(--cave-line)"]{color:var(--ink)!important}
  .light-preview [style*="border:2px solid var(--cave-3)"]{border-color:var(--bg-2)!important}
  .light-preview [style*="color:var(--hp-n)"]{color:var(--hp)!important}
  .light-preview [style*="color:var(--gold-n)"]{color:var(--gold-ink)!important}
  .light-preview [style*="#37304E"]{border-color:var(--bg-2)!important}
  .light-preview .checkbox:not(.on){background:var(--panel)!important;border-color:var(--ink-3)!important}
  .light-preview [style*="text-decoration:line-through"]{color:var(--ink-2)!important;opacity:1!important;text-decoration-color:var(--danger);text-decoration-thickness:2px}
  .light-preview .dg{color:var(--ink);background:var(--panel);border-color:var(--panel-line)}
  .light-preview .dg.dim{color:var(--ink-3);background:var(--bg-2)}
  .light-preview .dg.today{background:var(--gold);color:var(--ink);box-shadow:2px 2px 0 rgba(43,38,32,.4)}
  .light-preview .xpbar .cell.fill{background:var(--xp)!important}.light-preview .xpbar .cell:not(.fill){background:var(--bg)!important;border-color:var(--panel-line)!important}
  .light-preview .nav{background:var(--panel);border-top-color:var(--panel-line)}
  .light-preview .nav .item{border-color:var(--panel-line);color:var(--ink-2);background:var(--bg)}
  .light-preview .nav .item.on{background:var(--ink);color:var(--gold)}
  .light-preview .nav .plus{background:var(--gold);color:var(--ink);border-color:var(--panel-line);box-shadow:2px 2px 0 var(--panel-line)}
  .night-staging{margin-top:68px;padding-top:28px;border-top:3px dashed var(--panel-line)}
  .night-staging h2{text-align:center;font-size:20px;font-weight:800}.night-staging p{text-align:center;margin-top:7px;color:var(--ink-2);font-size:12px;font-weight:600}
  .night-staging-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:46px 30px;justify-items:center;margin-top:44px}
  .night-stage{position:relative}.night-stage h3{position:absolute;top:-27px;left:2px;color:var(--ink-2);font-size:12px;font-weight:800;letter-spacing:.1em}

  footer{margin-top:60px;text-align:center;font-size:12px;color:var(--ink-3);letter-spacing:.2em;font-weight:800}
</style>

html,body{margin:0!important;padding:0!important;background:#E8E0CC;background-image:none;width:314px;height:648px;overflow:hidden}

</style>
